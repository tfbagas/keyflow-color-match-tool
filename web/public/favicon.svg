<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Material 3 Achromatic Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#151519" stroke="#2E2E36" stroke-width="2" />
  <rect x="6" y="6" width="52" height="52" rx="12" fill="#1E1E24" />

  <!-- Outer Orbital Ring (Tilted Ellipse) -->
  <ellipse
    cx="32"
    cy="32"
    rx="22"
    ry="9.5"
    transform="rotate(-28 32 32)"
    stroke="#9CA3AF"
    stroke-opacity="0.55"
    stroke-width="2.4"
  />

  <!-- Central Keyflow Diamond / Prism -->
  <path
    d="M32 10L44.5 32L32 54L19.5 32L32 10Z"
    fill="#E2E4E9"
  />
  <!-- Subtle Right Facet Tonal Shade for 3D Prism Depth -->
  <path
    d="M32 10L44.5 32L32 54V10Z"
    fill="#9CA3AF"
    fill-opacity="0.38"
  />

  <!-- Satellite Diamond Dot (Bottom-Right) -->
